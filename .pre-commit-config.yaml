# Instalar uma vez: uv run pre-commit install
# Hooks locais: usam as versões travadas no uv.lock, sem baixar nada à parte.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: dados-pessoais
        name: dados pessoais (CPF, e-mail, R$, celular, lista local)
        entry: uv run python scripts/checar_dados_pessoais.py
        language: system
        types: [text]
        exclude: ^uv\.lock$

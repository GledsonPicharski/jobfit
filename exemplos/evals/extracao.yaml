# Textos fictícios com os fatos que `extrair_fatos` deveria achar.
# Cada esperado é um trecho curto que precisa aparecer (por palavras) em algum fato extraído.

textos:
  - nome: gestora-dados
    texto: |
      Entre 2019 e 2022 fui coordenadora de dados na Varejo Exemplo. Montei o time do zero,
      com 6 pessoas, e reduzimos em 40% o tempo de fechamento mensal. Uso Python e SQL todo
      dia e tenho inglês avançado.
    esperados:
      - coordenadora de dados
      - 40%
      - Python
      - SQL
      - inglês avançado

  - nome: professor
    texto: |
      Dou aula de estatística aplicada no MBA da Faculdade Fictícia desde 2021, uma turma por
      semestre. Antes disso, publiquei um artigo sobre séries temporais no Congresso Exemplo.
    esperados:
      - estatística aplicada
      - séries temporais

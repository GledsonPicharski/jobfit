<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}JobFit{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/"><strong>JobFit</strong></a></li></ul>
      <ul>
        {% if perfil %}
        <li><a href="/p/{{ perfil.slug }}">{{ perfil.nome }}</a></li>
        <li><a href="/p/{{ perfil.slug }}/dossie">Dossiê</a></li>
        <li><a href="/p/{{ perfil.slug }}/ia">IA</a></li>
        {% endif %}
        <li><a href="/" class="secondary">Perfis</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>

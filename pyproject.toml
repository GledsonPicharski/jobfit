[project]
name = "jobfit"
version = "0.1.0"
description = "App local e gratuito de evolução de carreira: dossiê vivo, avaliação de vagas, CV por vaga e candidaturas."
authors = [{ name = "Gledson Picharski" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "pdfplumber>=0.11.10",
    "platformdirs>=4.14.0",
    "pydantic-ai-slim[anthropic,openai]>=2.63.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
jobfit = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID251", "PLW1514"]
preview = true
explicit-preview-rules = true
allowed-confusables = ["–", "—"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic_ai".msg = "Regra 2: só app/ia/ fala com provedor de IA. Use app.ia.executar()."
"anthropic".msg = "Regra 2: só app/ia/ fala com provedor de IA. Use app.ia.executar()."
"openai".msg = "Regra 2: só app/ia/ fala com provedor de IA. Use app.ia.executar()."
"keyring".msg = "Chaves só via app.ia.chaves."

[tool.ruff.lint.per-file-ignores]
"app/ia/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
